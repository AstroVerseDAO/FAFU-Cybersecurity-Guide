site_name: 福建农林大学网络空间安全专业指南
site_url: https://openfafu.github.io/FAFU-Cybersecurity-Guide/
site_author: OpenFAFU
site_description: >-
  福建农林大学网络空间安全专业指南 —— 面向 FAFU 网安学子的开源学习路线、课程地图与自学资源站
repo_name: FAFU-Cybersecurity-Guide
repo_url: https://github.com/OpenFAFU/FAFU-Cybersecurity-Guide/
copyright: Copyright &copy; 2024-present <a href="https://github.com/OpenFAFU" target="_blank" rel="noopener noreferrer">OpenFAFU</a>

theme:
  name: material
  language: zh
  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenFAFU/FAFU-Cybersecurity-Guide/
  generator: false

nav:
